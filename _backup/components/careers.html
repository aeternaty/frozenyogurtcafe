<!-- Careers Section -->
<section id="careers" class="py-16 bg-white">
    <div class="container mx-auto px-4">
        <div class="text-center mb-12">
            <h2 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">Join Our Team</h2>
            <p class="text-lg text-gray-600 max-w-3xl mx-auto">We're always looking for energetic, friendly people to
                join our team. If you're passionate about customer service and love creating smiles, we'd love to hear
                from you!</p>
        </div>

        <div class="max-w-3xl mx-auto bg-white rounded-lg shadow-sm p-8">
            <form id="job-application-form" class="careers-form">
                <!-- Honeypot fields for spam protection -->
                <div style="display:none">
                    <input type="text" name="website" autocomplete="off" tabindex="-1">
                    <input type="text" name="email_confirm" autocomplete="off" tabindex="-1">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div>
                        <label for="applicant-name" class="block text-gray-700 font-medium mb-2">Full Name *</label>
                        <input type="text" id="applicant-name" name="applicant-name" required
                            pattern="^[a-zA-Z\s]{2,50}$"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20 text-gray-700"
                            placeholder="Enter your full name">
                    </div>
                    <div>
                        <label for="applicant-age" class="block text-gray-700 font-medium mb-2">Age *</label>
                        <input type="number" id="applicant-age" name="applicant-age" required min="16" max="99"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20 text-gray-700"
                            placeholder="Enter your age">
                    </div>
                    <div>
                        <label for="applicant-email" class="block text-gray-700 font-medium mb-2">Email Address
                            *</label>
                        <input type="email" id="applicant-email" name="applicant-email" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20 text-gray-700"
                            placeholder="Enter your email">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label for="applicant-phone" class="block text-gray-700 font-medium mb-2">Phone Number *</label>
                        <input type="tel" id="applicant-phone" name="applicant-phone" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20 text-gray-700"
                            placeholder="Enter your phone number">
                    </div>
                    <div>
                        <label for="preferred-location" class="block text-gray-700 font-medium mb-2">Preferred Location
                            *</label>
                        <div class="relative">
                            <select id="preferred-location" name="preferred-location" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20 text-gray-700 appearance-none pr-8">
                                <option value="">Select location</option>
                                <option value="marlboro">Marlboro</option>
                                <option value="new-providence">New Providence</option>
                                <option value="any">Any Location</option>
                            </select>
                            <div class="absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none">
                                <i class="ri-arrow-down-s-line text-gray-400"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label for="position-type" class="block text-gray-700 font-medium mb-2">Position Type *</label>
                        <div class="relative">
                            <select id="position-type" name="position-type" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20 text-gray-700 appearance-none pr-8">
                                <option value="">Select position type</option>
                                <option value="full-time">Full Time</option>
                                <option value="part-time">Part Time</option>
                            </select>
                            <div class="absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none">
                                <i class="ri-arrow-down-s-line text-gray-400"></i>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label for="availability" class="block text-gray-700 font-medium mb-2">Availability *</label>
                        <div class="relative">
                            <select id="availability" name="availability" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20 text-gray-700 appearance-none pr-8">
                                <option value="">Select availability</option>
                                <option value="weekdays">Weekdays</option>
                                <option value="weekends">Weekends</option>
                                <option value="both">Both Weekdays & Weekends</option>
                            </select>
                            <div class="absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none">
                                <i class="ri-arrow-down-s-line text-gray-400"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-6">
                    <label for="experience" class="block text-gray-700 font-medium mb-2">Relevant Experience</label>
                    <textarea id="experience" name="experience" rows="4"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20 text-gray-700"
                        placeholder="Tell us about your previous work experience, especially in customer service or food service"></textarea>
                </div>

                <div class="mb-6">
                    <label for="why-join" class="block text-gray-700 font-medium mb-2">Why do you want to join Get Yo?
                        *</label>
                    <textarea id="why-join" name="why-join" required rows="4"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20 text-gray-700"
                        placeholder="Tell us why you'd like to join our team and what makes you a great fit"></textarea>
                </div>

                <div class="mb-6">
                    <label class="custom-checkbox flex items-start">
                        <input type="checkbox" name="terms" id="consent-checkbox" required>
                        <span class="checkmark"></span>
                        <span class="ml-6 text-gray-700 cursor-pointer select-none">I confirm that all information
                            provided is accurate and I consent to reference checks *</span>
                    </label>
                </div>

                <!-- reCAPTCHA -->
                <div class="mb-6 recaptcha-wrapper">
                    <div class="g-recaptcha" id="careers-recaptcha"></div>
                </div>

                <button type="submit"
                    class="bg-primary text-white px-6 py-3 rounded-button font-medium hover:bg-opacity-90 whitespace-nowrap flex items-center justify-center w-full md:w-auto"
                    data-requires-recaptcha="true">
                    <i class="ri-send-plane-line mr-2"></i>
                    Submit Application
                </button>
            </form>
        </div>
    </div>
</section>
