<!-- Header Component - Düzeltilmiş Versiyon -->
<header class="bg-white shadow-sm fixed w-full top-0 z-50 overflow-x-hidden">
    <div class="container mx-auto px-4 py-3 max-w-full overflow-x-hidden">
        <div class="flex items-center justify-between w-full">
            <!-- Mobile Menu Button -->
            <div class="lg:hidden w-10 h-10 flex items-center justify-center cursor-pointer" id="mobile-menu-button">
                <i class="ri-menu-line text-gray-700 text-xl transition-all duration-300" id="menu-icon"></i>
            </div>

            <!-- Desktop Navigation - Left -->
            <nav class="hidden lg:flex items-center space-x-8 flex-1">
                <a href="#" class="text-gray-700 hover:text-primary font-medium transition-colors">Home</a>
                <a href="#locations"
                    class="text-gray-700 hover:text-primary font-medium transition-colors">Locations</a>
                <a href="#menu" class="text-gray-700 hover:text-primary font-medium transition-colors">Menu</a>
                <a href="#careers" class="text-gray-700 hover:text-primary font-medium transition-colors">Careers</a>
            </nav>

            <!-- Logo - Centered -->
            <div class="flex items-center justify-center flex-1 lg:flex-initial">
                <img src="assets/images/logo.png" alt="Get Yo Logo" class="h-12 sm:h-14 md:h-16">
            </div>

            <!-- Desktop Navigation - Right -->
            <nav class="hidden lg:flex items-center space-x-8 flex-1 justify-end">
                <a href="#contact" class="text-gray-700 hover:text-primary font-medium transition-colors">Contact</a>
                <a href="#locations"
                    class="bg-primary text-white px-4 py-2 rounded-button font-medium hover:bg-opacity-90 transition-all whitespace-nowrap">Find
                    Us</a>
            </nav>

            <!-- Mobile Find Us Button -->
            <div class="lg:hidden w-10 h-10 flex items-center justify-center">
                <a href="#locations"
                    class="bg-primary text-white w-10 h-10 rounded-button flex items-center justify-center transition-all hover:bg-opacity-90">
                    <i class="ri-map-pin-line text-lg"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- Mobile Menu - Düzeltilmiş Yapı -->
    <div id="mobile-menu" class="lg:hidden bg-white shadow-md mobile-menu-closed hidden"
        style="position: absolute; top: 100%; left: 0; right: 0; z-index: 1000;">
        <div class="container mx-auto px-4 max-w-full">
            <nav class="flex flex-col py-2">
                <a href="#"
                    class="text-gray-700 hover:text-primary hover:bg-gray-50 font-medium py-3 px-4 transition-all border-b border-gray-100">
                    <i class="ri-home-line mr-3"></i>Home
                </a>
                <a href="#locations"
                    class="text-gray-700 hover:text-primary hover:bg-gray-50 font-medium py-3 px-4 transition-all border-b border-gray-100">
                    <i class="ri-map-pin-line mr-3"></i>Locations
                </a>
                <a href="#menu"
                    class="text-gray-700 hover:text-primary hover:bg-gray-50 font-medium py-3 px-4 transition-all border-b border-gray-100">
                    <i class="ri-restaurant-line mr-3"></i>Menu
                </a>
                <a href="#careers"
                    class="text-gray-700 hover:text-primary hover:bg-gray-50 font-medium py-3 px-4 transition-all border-b border-gray-100">
                    <i class="ri-briefcase-line mr-3"></i>Careers
                </a>
                <a href="#contact"
                    class="text-gray-700 hover:text-primary hover:bg-gray-50 font-medium py-3 px-4 transition-all">
                    <i class="ri-mail-line mr-3"></i>Contact
                </a>
            </nav>
        </div>
    </div>
</header>
